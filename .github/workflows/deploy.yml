name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur GITHUB_TOKEN-Rechte, die Pages braucht.
permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        # Auf Pages liegt die App unter /<repo>/ – ausser bei einer
        # <user>.github.io-Seite, die direkt unter / ausgeliefert wird.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
